apiVersion: 1

# Loads every dashboard JSON under /var/lib/grafana/dashboards on boot.
# The folder is bind-mounted from ./grafana/dashboards (see docker-compose.yml),
# so dashboards live in the repo and survive volume wipes.
providers:
  - name: KickSneak
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
