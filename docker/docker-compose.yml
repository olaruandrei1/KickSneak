services:
  # ── Infrastructure ──
  postgres:
    image: postgres:16-alpine
    container_name: kicksneak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kicksneak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: kicksneak-azurite
    restart: unless-stopped
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0

  # ── AI ──
  ollama-seed:
    image: ollama/ollama
    container_name: kicksneak-ollama-seed
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_seed_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-chat:
    image: ollama/ollama
    container_name: kicksneak-ollama-chat
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_chat_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Backend .NET ──
  backend:
    build:
      context: ../kicksneak-be
      dockerfile: Dockerfile
    container_name: kicksneak-backend
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5005
      # DB
      - DB_CONNECTION=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=ks_owner;Password=${KS_OWNER_PASSWORD};Pooling=true;Minimum Pool Size=2;Maximum Pool Size=20
      - DB_ADMIN_CONNECTION=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Redis
      - REDIS_CONNECTION=redis:6379
      # Azure Storage (Azurite)
      - AZURE_BLOB_CONNECTION=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1
      - AZURE_TABLE_CONNECTION=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://azurite:10002/devstoreaccount1
      # Stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # Firebase
      - FIREBASE_CREDENTIALS_B64=${FIREBASE_CREDENTIALS_B64}
      # CORS
      - CORS_ORIGINS=http://localhost:3000
      # Ollama
      - OLLAMA_URL=http://ollama-seed:11434
      - OLLAMA_MODEL=qwen2.5:7b
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_started
      ollama-seed:
        condition: service_healthy

  # ── Chat Service (Go) ──
  chat-service:
    build:
      context: ../kicksneak-chat
      dockerfile: Dockerfile
    container_name: kicksneak-chat
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://ks_chat_service:${KS_CHAT_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - OLLAMA_URL=http://ollama-chat:11434
      - OLLAMA_MODEL=llama3.1:8b
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
      ollama-chat:
        condition: service_healthy

  # ── Frontend (nginx) ──
  frontend:
    build:
      context: ../kicksneak-fe
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5005
        - VITE_USE_MOCKS=false
        - VITE_CHAT_WS_URL=ws://localhost:8080
        - VITE_CHAT_API_URL=http://localhost:8080
        - VITE_GUARDS_ENABLED=true
    container_name: kicksneak-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  azurite_data:
  ollama_seed_data:
  ollama_chat_data: