services:
  # ── Infrastructure ──
  postgres:
    image: postgres:16-alpine
    container_name: kicksneak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kicksneak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Web UI for Redis. The RI_REDIS_* env pre-adds the connection on every boot
  # (survives `down -v`), and terms are auto-accepted so it opens click-free.
  redisinsight:
    image: redis/redisinsight:latest
    container_name: kicksneak-redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    environment:
      - RI_ACCEPT_TERMS_AND_CONDITIONS=true
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_ALIAS=KickSneak Cache
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: kicksneak-azurite
    restart: unless-stopped
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0

  ollama-chat:
    image: ollama/ollama
    container_name: kicksneak-ollama-chat
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_chat_data:/root/.ollama
    # Serve + self-heal the chat model: on a fresh volume (e.g. after `down -v`)
    # the pull downloads llama3.1:8b; if it's already present the pull is a no-op.
    entrypoint: ["/bin/sh", "-c", "ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull llama3.1:8b || true; wait"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Search & Analytics ──
  elasticsearch:
    image: elasticsearch:9.0.2
    container_name: kicksneak-elastic
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: kibana:9.0.2
    container_name: kicksneak-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ── Observability (replaces Application Insights) ──
  prometheus:
    image: prom/prometheus:latest
    container_name: kicksneak-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  loki:
    image: grafana/loki:latest
    container_name: kicksneak-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  # Ships every container's stdout/stderr into Loki (no app code needed).
  promtail:
    image: grafana/promtail:latest
    container_name: kicksneak-promtail
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: kicksneak-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=kicksneak
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      # Provisioning-as-code: datasources + dashboards live in the repo and are
      # re-applied on every boot, so `docker compose down -v` never loses them.
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki

  # ── Backend .NET ──
  backend:
    build:
      context: ../kicksneak-be
      dockerfile: Dockerfile
    container_name: kicksneak-backend
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5005
      # DB
      - DB_CONNECTION=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=ks_owner;Password=${KS_OWNER_PASSWORD};Pooling=true;Minimum Pool Size=2;Maximum Pool Size=20
      - DB_ADMIN_CONNECTION=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Redis
      - REDIS_CONNECTION=redis:6379
      # Azure Storage (Azurite)
      - AZURE_BLOB_CONNECTION=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1
      - AZURE_TABLE_CONNECTION=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://azurite:10002/devstoreaccount1
      # Stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # Firebase
      - FIREBASE_CREDENTIALS_B64=${FIREBASE_CREDENTIALS_B64}
      # CORS
      - CORS_ORIGINS=http://localhost:3000
      # Ollama
      - OLLAMA_URL=http://ollama-seed:11434
      - OLLAMA_MODEL=qwen2.5:7b
      # Elasticsearch
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # AI recommender service
      - AI_SERVICE_URL=http://ai-service:5050
      # Web Push (VAPID)
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      # Observability
      - LOKI_URL=http://loki:3100
      # Internal service token (admin-v2 → backend)
      - KS_ADMIN_PASSWORD=${KS_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  # ── Seed ETL (runs once after backend) ──
  seed-etl:
    build:
      context: ../kicksneak-be/KickSneak.Seed.DatabaseETL
      dockerfile: Dockerfile
    container_name: kicksneak-seed-etl
    restart: "no"
    environment:
      - SEED_CONNECTION=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=true
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      backend:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  # ── Chat Service (Go) ──
  chat-service:
    build:
      context: ../kicksneak-chat
      dockerfile: Dockerfile
    container_name: kicksneak-chat
    restart: unless-stopped
    entrypoint: ["sh", "-c", "sleep 40 && /chat-server"]
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://ks_chat_service:${KS_CHAT_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - OLLAMA_URL=http://ollama-chat:11434
      - OLLAMA_MODEL=llama3.1:8b
      - PORT=8080
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      ollama-chat:
        condition: service_healthy

  # ── Frontend (nginx) ──
  frontend:
    build:
      context: ../kicksneak-fe
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5005
        - VITE_USE_MOCKS=false
        - VITE_CHAT_WS_URL=ws://127.0.0.1:8080
        - VITE_CHAT_API_URL=http://127.0.0.1:8080
        - VITE_GUARDS_ENABLED=true
    container_name: kicksneak-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ── Admin App (Next.js) ──
  admin-app:
    build:
      context: ../kicksneak-admin-v2
      dockerfile: Dockerfile
    container_name: kicksneak-admin-v2
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - DATABASE_URL=postgresql://ks_admin:KsAdmin2026!@postgres:5432/${POSTGRES_DB}?schema=public
      - KS_ADMIN_PASSWORD=${KS_ADMIN_PASSWORD}
      - BACKEND_URL=http://backend:5005
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  # ── Admin Live Support WS Server ──
  admin-ws:
    build:
      context: ../kicksneak-admin-v2
      dockerfile: Dockerfile.ws
    container_name: kicksneak-admin-ws
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - DATABASE_URL=postgresql://ks_admin:KsAdmin2026!@postgres:5432/${POSTGRES_DB}?schema=public
      - WS_PORT=3005
    depends_on:
      postgres:
        condition: service_healthy

  # ── AI Training (runs once after seed) ──
  ai-train:
    build:
      context: ../kicksneak-ai
      dockerfile: Dockerfile
    container_name: kicksneak-ai-train
    restart: "no"
    entrypoint: ["python", "scripts/train.py"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=ks_owner
      - DB_PASSWORD=${KS_OWNER_PASSWORD}
      - MODEL_DIR=/models
    volumes:
      - ai_models:/models
    depends_on:
      seed-etl:
        condition: service_completed_successfully

  # ── AI Service (Flask/PyTorch) ──
  ai-service:
    build:
      context: ../kicksneak-ai
      dockerfile: Dockerfile
    container_name: kicksneak-ai
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=ks_owner
      - DB_PASSWORD=${KS_OWNER_PASSWORD}
      - MODEL_DIR=/models
      - FLASK_PORT=5050
    volumes:
      - ai_models:/models
    depends_on:
      ai-train:
        condition: service_completed_successfully

  # ── AI Scheduler (.NET Quartz) — hourly per-user retrain trigger ──
  ai-scheduler:
    build:
      context: ../kicksneak-be/KickSneak.AiScheduler
      dockerfile: Dockerfile
    container_name: kicksneak-ai-scheduler
    restart: unless-stopped
    environment:
      - AI_SERVICE_URL=http://ai-service:5050
      - RETRAIN_CRON=0 0 * * * ?
    depends_on:
      ai-service:
        condition: service_started

volumes:
  postgres_data:
  redisinsight_data:
  azurite_data:
  ollama_chat_data:
  elastic_data:
  prometheus_data:
  loki_data:
  grafana_data:
  ai_models:
